<!DOCTYPE html>
<html lang="ko" translate="no">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- GitHub Pages SPA 리다이렉트 복원: 404.html이 인코딩한 경로를 history로 되돌린다 -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>

    <!-- 기본 메타: 페이지별 상세 메타(title/description/og 등)는 react-helmet-async가 관리.
         JS 실행 전 기본 fallback 용도만 남기고, 중복 방지를 위해 관리형 메타는 Helmet으로 일원화. -->
    <title>스펙마루 - 스마트폰, 노트북, 이어폰, 중고폰 비교</title>
    <meta name="keywords" content="스마트폰 스펙 비교, 노트북 스펙 비교, 이어폰 스펙 비교, 중고폰, 공기계, 스펙마루, IT 기기 비교" />
    <meta name="google" content="notranslate" />

    <!-- Apple / Web App -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- 구조화 데이터 (Rich Snippet) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "스펙마루",
      "url": "https://specmaru.com",
      "description": "스펙마루에서 스마트폰, 노트북, 이어폰, 중고폰, 공기계 등 다양한 기기 스펙을 비교하세요.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://specmaru.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "스펙마루",
      "url": "https://specmaru.com",
      "logo": "https://specmaru.com/logo.png",
      "sameAs": [
        "https://www.facebook.com/specmaru",
        "https://twitter.com/specmaru"
      ]
    }
    </script>
  </head>
  <body>
    <noscript>JavaScript를 활성화 해주세요.</noscript>
    <div id="root"></div>
  </body>
</html>
